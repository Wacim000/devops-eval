groups:
  - name: app
    rules:
      # Plus de 5 % des requetes en erreur 5xx sur les 5 dernieres minutes.
      # 5 % = 1 requete sur 20 qui plante : les utilisateurs le voient.
      # for: 5m -> on ignore un pic court (ex : pendant un redemarrage).
      - alert: TauxErreurs5xxEleve
        expr: |
          sum(rate(http_requests_total{code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m

      # p95 de latence au-dessus de 500 ms.
      # Normalement les requetes prennent < 50 ms, donc 500 ms = 10x plus lent.
      # for: 10m -> la latence varie beaucoup, on attend que ca dure.
      - alert: LatenceP95Elevee
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
