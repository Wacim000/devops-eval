name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # permet au CD de lancer cette CI avant de deployer

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
      - run: ruff check .
      - run: yamllint -d relaxed .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pytest --junitxml=report-${{ matrix.python-version }}.xml
        env:
          REDIS_URL: redis://localhost:6379/0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.xml

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
      - run: ls -R test-report-*
      - run: docker build -t devops-eval:ci .

  ci-ok:
    needs: [lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verifier que tous les jobs sont verts
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI OK"
