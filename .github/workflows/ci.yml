name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Permet au CD de réutiliser exactement la même CI avant de construire l'image
  workflow_call:

# Moindre privilège : lecture seule du dépôt
permissions:
  contents: read

jobs:
  lint-yaml:
    name: lint-yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
      - name: yamllint (workflows, compose, monitoring)
        run: yamllint --strict .

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Toutes les cases s'exécutent, mais un échec sur une seule fait échouer le job
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests d'intégration (Redis réel)
        run: |
          mkdir -p reports
          pytest -v \
            --junitxml=reports/junit-py${{ matrix.python-version }}.xml \
            --cov=app --cov-report=term --cov-report=xml:reports/coverage-py${{ matrix.python-version }}.xml
      - name: Publication des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-yaml, lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Récupération des rapports de tests
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: reports
          merge-multiple: true
      - name: Résumé des rapports
        run: |
          ls -la reports
          {
            echo "### Rapports de tests"
            for f in reports/junit-*.xml; do
              tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1)
              failures=$(grep -o 'failures="[0-9]*"' "$f" | head -1)
              echo "- $(basename "$f") : $tests $failures"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-eval:ci
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vérification non-root
        run: test "$(docker run --rm --entrypoint id devops-eval:ci -u)" != "0"
      - name: Smoke test docker compose
        env:
          APP_IMAGE: devops-eval:ci
        run: |
          docker compose up -d --no-build --wait app
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent http://localhost:8000/metrics | grep -q http_requests_total
      - name: Nettoyage
        if: always()
        run: docker compose down -v

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [lint-yaml, lint, test, build]
    steps:
      - name: Tous les jobs doivent être verts
        run: |
          echo "lint-yaml=${{ needs.lint-yaml.result }} lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }} build=${{ needs.build.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Au moins un job de la CI n'est pas vert"
            exit 1
          fi
          echo "CI verte"
